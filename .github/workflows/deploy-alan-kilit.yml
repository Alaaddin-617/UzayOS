name: Deploy Alan Kilit

on:
  push:
    branches: [main]
    paths:
      - "alan-kilit/**"
      - ".github/workflows/deploy-alan-kilit.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: alan-kilit
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
